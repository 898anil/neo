<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="neo">
<meta name="theme-color" content="#1C1C1F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>neo</title>
<style>
  /* Built like a native tool, not a landing page: the system font, one ruled list per view, small
     status rings in the gutter, and colour only where something needs a person. */
  :root {
    --ink: #FFFFFF; --panel: #FFFFFF; --raise: #F3F3F5; --line: #E4E4E8; --side: #F7F7F8;
    --text: #1D1D21; --muted: #5E5E68; --faint: #8E8E98;
    --amber: #D9820B; --azure: #0B63CE; --mint: #2E8B57; --coral: #D63A2F; --idle: #B4B4BC;
    --amber-ink: #A85F00; --amber-wash: rgba(217, 130, 11, .10); --azure-wash: rgba(11, 99, 206, .10);
    --you: #EEF3FB; --seg-on: #FFFFFF; --sel: #ECEDF0; --badge: #E5483D;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --tabbar: 56px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #1C1C1F; --panel: #1C1C1F; --raise: #2A2A2E; --line: #33333A; --side: #161618;
      --text: #ECECEF; --muted: #A2A2AB; --faint: #74747D;
      --amber: #F0A23A; --azure: #4C9BFF; --mint: #4DBB7F; --coral: #FF6A5E; --idle: #55555E;
      --amber-ink: #F0A23A; --amber-wash: rgba(240, 162, 58, .14); --azure-wash: rgba(76, 155, 255, .14);
      --you: #24324A; --seg-on: #3A3A41; --sel: #2A2A2E; --badge: #FF5A4E;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--ink); color: var(--text); }
  body { font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  a { color: var(--azure); text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--azure); outline-offset: 1px; border-radius: 5px; }

  /* ---------- shell ---------- */
  .screen { min-height: 100dvh; padding: env(safe-area-inset-top) 0 calc(var(--tabbar) + env(safe-area-inset-bottom) + 24px); }
  .screen.detail { padding-bottom: 0; display: flex; flex-direction: column; height: 100dvh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .enter-push { animation: push .16s ease-out; }
  @keyframes push { from { transform: translateX(16px); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .enter-push, .sheet, .scrim, .toast { animation: none; } }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--side);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .row { max-width: 520px; margin: 0 auto; height: var(--tabbar); display: grid; grid-template-columns: 1fr 1fr 60px 1fr 1fr; align-items: center; }
  .tab { display: grid; justify-items: center; gap: 1px; font-size: 10.5px; font-weight: 500; color: var(--faint); padding: 6px 0; position: relative; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--azure); }
  .tab .count { position: absolute; top: 1px; left: calc(50% + 5px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--badge); color: #fff; font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; }
  .fab { justify-self: center; width: 40px; height: 40px; border-radius: 50%; background: var(--azure); color: #fff; display: grid; place-items: center; }
  .fab svg { width: 22px; height: 22px; }

  /* ---------- page header ---------- */
  .hero { padding: 18px 0 4px; }
  .host { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 13px; }
  .host .live { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
  .host .live.stale { background: var(--coral); }
  .hero h1 { font: 700 26px/1.2 var(--display); letter-spacing: -.01em; margin: 10px 0 2px; }
  .hero h1.calm { color: var(--text); }
  .strip { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 18px; }
  .hero .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }

  /* Status rings, like an issue tracker's: hollow = idle, half = working, solid = needs you / done / failed. */
  .lamp { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; vertical-align: middle; box-shadow: inset 0 0 0 1.5px var(--idle); background: none; }
  .strip a { display: grid; place-items: center; width: 28px; height: 28px; }
  .lamp.sm { width: 11px; height: 11px; }
  .lamp.blocked, .lamp.asks { background: var(--amber); box-shadow: none; }
  .lamp.working, .lamp.running, .lamp.starting, .lamp.moving { box-shadow: inset 0 0 0 1.5px var(--azure);
    background: conic-gradient(var(--azure) 0 50%, transparent 0); background-clip: content-box; padding: 3px; }
  .lamp.done, .lamp.waiting, .lamp.review { box-shadow: inset 0 0 0 1.5px var(--mint); background: radial-gradient(circle, var(--mint) 0 2.5px, transparent 3px); }
  .lamp.failed, .lamp.cancelled, .lamp.stuck { background: var(--coral); box-shadow: none; }
  .lamp.closed { box-shadow: inset 0 0 0 1.5px var(--idle); }
  .lamp.partial { background: conic-gradient(var(--amber) 0 75%, transparent 75%); box-shadow: inset 0 0 0 1.5px var(--amber); }

  h2.section { font: 600 13px/1.2 var(--body); color: var(--muted); margin: 26px 0 8px; }

  /* ---------- lists ---------- */
  .list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row-link { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: inherit; align-items: start; }
  .list > :last-child, .list > :last-child .row-link { border-bottom: 0; }
  .row-link .lamp { margin-top: 3px; }
  .row-link .t { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-link .when { color: var(--faint); font-size: 13px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .row-link .s { grid-column: 2 / 4; color: var(--muted); font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-link .said { grid-column: 2 / 4; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-link:hover, .row-link:active { background: var(--raise); }
  .empty { color: var(--faint); padding: 28px 0; text-align: center; }

  /* ---------- needs-you items: rows of one list, not separate cards ---------- */
  .ask { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 12px 14px; margin: 0; }
  .ask:not(.ask + .ask) { border-top: 1px solid var(--line); border-radius: 8px 8px 0 0; margin-top: 4px; }
  .ask:not(:has(+ .ask)) { border-radius: 0 0 8px 8px; margin-bottom: 8px; }
  .ask:not(.ask + .ask):not(:has(+ .ask)) { border-radius: 8px; }
  .ask .who { display: grid; grid-template-columns: 14px 1fr auto; gap: 0 12px; align-items: baseline; }
  .ask .who .lamp { align-self: start; margin-top: 3px; }
  .ask .who a { color: var(--text); font-weight: 600; font-size: 15px; line-height: 1.35; }
  .ask .who a:hover { text-decoration: underline; text-decoration-color: var(--line); }
  .ask .where { grid-column: 2 / 4; color: var(--faint); font-size: 12.5px; overflow-wrap: anywhere; min-width: 0; }
  .ask .who span { color: var(--faint); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ask > :not(.who) { margin-left: 26px; max-width: calc(100% - 26px); }
  .ask .what { color: var(--text); font-weight: 400; font-size: 14.5px; margin-top: 4px; }
  .ask .body { margin-top: 6px; font-size: 14.5px; }
  .ask pre { max-height: 180px; }
  .ask .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .ask .reply { display: flex; gap: 6px; margin-top: 10px; }
  .ask .reply input { flex: 1; min-width: 0; }

  .btn { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px; font-weight: 500; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .04); display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
  .btn:hover:not(:disabled) { background: var(--raise); }
  .btn.go { background: var(--azure); border-color: var(--azure); color: #fff; }
  .btn.primary { background: var(--text); border-color: var(--text); color: var(--ink); }
  .btn.quiet { background: transparent; box-shadow: none; }
  .btn:disabled { opacity: .5; }
  input.field, textarea.field { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 34px; }
  input.field::placeholder, textarea.field::placeholder { color: var(--faint); }
  input.field:focus, textarea.field:focus { border-color: var(--azure); box-shadow: 0 0 0 3px var(--azure-wash); outline: none; }

  /* ---------- today (brief): a document, not a card ---------- */
  .today { margin-top: 18px; }
  .today .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .today .head b { font: 600 17px/1.3 var(--display); }
  .today .head span { color: var(--faint); font-size: 13px; }
  .today .body { margin-top: 8px; font-size: 15px; max-height: 260px; overflow: hidden; position: relative; }
  .today .body.full { max-height: none; }
  .today .body:not(.full)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, var(--ink)); }
  .today .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .today p.lead { color: var(--muted); margin: 6px 0 0; font-size: 14.5px; }
  .lamp.sev-high { background: var(--coral); box-shadow: none; } .lamp.sev-medium { background: var(--amber); box-shadow: none; } .lamp.sev-low { box-shadow: inset 0 0 0 1.5px var(--idle); }
  .ask .body.clamp { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .host .gear { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; color: var(--faint); border-radius: 6px; }
  .host .gear:hover { background: var(--raise); color: var(--text); }
  .host .gear svg { width: 19px; height: 19px; }
  .sheet .md { overflow-wrap: anywhere; font-size: 15px; }
  .sheet h4 { font: 600 13px/1.2 var(--body); color: var(--muted); margin: 18px 0 8px; }
  .sheet .stack { margin-top: 20px; }
  .sheet input.field { width: 100%; }
  .more { margin-top: 12px; }
  .ci-success { background: var(--mint); box-shadow: none; } .ci-failure, .ci-error { background: var(--coral); box-shadow: none; } .ci-pending, .ci-expected { box-shadow: inset 0 0 0 1.5px var(--amber); }
  .tag { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .tag.bad { color: var(--coral); } .tag.good { color: var(--mint); } .tag.warn { color: var(--amber-ink); }
  .row-link .result-tag { margin-right: 6px; vertical-align: 1px; }
  .sheet .meta { color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .sheet .stack { display: grid; gap: 8px; }
  .sheet .stack .btn { height: 40px; justify-content: center; }

  /* ---------- detail ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--ink);
    padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); }
  .topbar .row { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 6px; padding: 6px 12px; }
  .back { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; color: var(--azure); }
  .back:hover { background: var(--raise); }
  .back svg { width: 22px; height: 22px; }
  .topbar .title { min-width: 0; }
  .topbar .title b { display: block; font: 600 15px/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title small { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  .seg { display: inline-flex; background: var(--raise); border-radius: 7px; padding: 2px; }
  .seg button { padding: 3px 10px; border-radius: 5px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }
  .links { max-width: 1200px; margin: 0 auto; display: flex; gap: 6px; padding: 0 16px 8px 54px; overflow-x: auto; scrollbar-width: none; }
  .links a, .links button { flex: none; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--text); }
  .links a:hover, .links button:hover { background: var(--raise); }

  .chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .chat .wrap { padding-top: 16px; padding-bottom: 24px; }
  .msg { margin: 12px 0; max-width: 92%; }
  .msg.you { margin-left: auto; background: var(--you); padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.agent { font-size: 15px; }
  .msg.agent .md > :first-child { margin-top: 0; }
  .note { text-align: center; color: var(--faint); font-size: 12.5px; margin: 16px 0; }
  .note.warn { color: var(--amber-ink); font-weight: 500; }
  .note.bad { color: var(--coral); }
  .note pre { text-align: left; }

  .steps { margin: 8px 0; border-left: 1px solid var(--line); padding-left: 12px; }
  .steps > button { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; padding: 3px 0; text-align: left; }
  .steps > button svg { width: 12px; height: 12px; transition: transform .12s; flex: none; }
  .steps.open > button svg { transform: rotate(90deg); }
  .steps.open .last { display: none; }
  .steps .last { color: var(--faint); font-weight: 400; font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .step { padding: 6px 0; }
  .step .tool { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .step .tool.err { color: var(--coral); }
  .step code.cmd { display: block; font: 12px/1.5 var(--mono); color: var(--text); white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
  .step details summary { cursor: pointer; color: var(--faint); font-size: 12px; margin-top: 3px; list-style: none; }
  .step details summary::-webkit-details-marker { display: none; }
  .step .think { color: var(--muted); font-style: italic; font-size: 13.5px; }

  pre { margin: 8px 0 0; padding: 8px 10px; background: var(--raise); border-radius: 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 360px; }
  .md p { margin: 0 0 8px; }
  .md p:last-child { margin-bottom: 0; }
  .md .h { font: 600 15px/1.3 var(--display); margin: 14px 0 4px; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .md code { font: .87em var(--mono); background: var(--raise); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  .msg.agent { overflow-wrap: anywhere; }
  .md pre code { background: none; padding: 0; }
  .screen-view pre { max-height: none; background: var(--side); }

  .composer { border-top: 1px solid var(--line); background: var(--ink); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .composer .chips { max-width: 1200px; margin: 0 auto 6px; padding: 0 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); }
  .chip:hover { background: var(--raise); }
  .chip.go { background: var(--azure); border-color: var(--azure); color: #fff; }
  .chip.stop { color: var(--coral); }
  .composer .row { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 6px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; max-height: 140px; line-height: 1.4; border-radius: 17px; padding: 6px 14px; }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--azure); color: #fff; display: grid; place-items: center; flex: none; }
  .send svg { width: 18px; height: 18px; }
  .send:disabled { background: var(--raise); color: var(--faint); }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 30; animation: fade .15s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--panel); border-radius: 12px 12px 0 0; max-height: 92dvh; overflow-y: auto;
    padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); animation: rise .2s ease-out; max-width: 640px; margin: 0 auto; box-shadow: 0 -1px 0 var(--line); }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { font: 700 20px/1.25 var(--display); margin: 0 0 14px; }
  .sheet form { display: grid; gap: 14px; }
  .sheet label.lbl { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .sheet .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .sheet .seg button { padding: 6px; font-size: 14px; }
  .sheet .hint { font-size: 12.5px; color: var(--faint); font-weight: 400; }
  .sheet textarea { min-height: 120px; resize: vertical; }
  .ask textarea.draft { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; resize: vertical; line-height: 1.4; }
  .recent { display: flex; gap: 6px; flex-wrap: wrap; }
  .recent button { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }

  .toast { position: fixed; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px); left: 50%; transform: translateX(-50%); z-index: 40; background: var(--text); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 14px; animation: fade .15s; max-width: 90vw; }

  /* ---------- agents board ---------- */
  .tally { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }
  .tally a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; }
  .tally a b { font-weight: 600; color: var(--text); }
  .group-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 26px 0 8px; scroll-margin-top: 16px; }
  .group-head h2 { font: 600 15px/1.2 var(--display); margin: 0; }
  .group-head h2 small { color: var(--faint); font: 400 14px var(--body); margin-left: 6px; }
  .group-head p { color: var(--faint); font-size: 13px; margin: 2px 0 0; }
  .group-head .btn { height: 28px; padding: 0 10px; font-size: 13px; flex: none; }
  .ask .what.bad { color: var(--coral); }
  .row-link .why { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  .row-link .why.review { color: var(--mint); }
  .row-link .why.failed { color: var(--coral); }
  .row-wrap { position: relative; }
  /* ---------- home: decide / regressed / moved ---------- */
  .stages { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; }
  .stages i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
  .stages i.on { background: var(--mint); }
  .stages.bad i.on { background: var(--coral); }
  .stages em { font-style: normal; margin-left: 8px; color: var(--muted); font-size: 12.5px; }
  .ask .stages { margin-top: 8px; }
  .ask .rec { margin-top: 8px; font-size: 14px; }
  .ask .risk { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .ask .ev { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .ask.regressed .who a { color: var(--coral); }
  .flags { margin: 6px 0 0; padding-left: 18px; color: var(--amber-ink); font-size: 13px; }
  .flags li { margin: 2px 0; }
  button.more { background: none; border: 0; color: var(--azure); font-size: 13px; padding: 6px 0 0; cursor: pointer; }
  .hero .since { color: var(--muted); font-size: 14px; margin: 0; }
  .ask-box { display: flex; gap: 6px; margin-top: 14px; }
  .ask-box input { flex: 1; min-width: 0; }
  .links .sum-pill { color: var(--mint); }

<script>
"use strict";

// GETs carry the ETag of what we already have; an unchanged poll is an empty 304 and we reuse the

const etags = new Map(); // path -> [etag, data]
async function api(path, opts = {}) {

function toast(text) { const t = h("div", { class: "toast", role: "status" }, text); document.body.append(t); setTimeout(() => t.remove(), 2400); }

const NUM = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
const count = (n, one, many) => `${NUM[n] || n} ${n === 1 ? one : many}`;
function ago(t) {
  if (!t) return "";
  const s = Date.now() / 1000 - t;
  if (s < 45) return "now";
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}
const agoIso = (iso) => (iso ? ago(Date.parse(iso) / 1000) : "");
const clock = (ts) => { const d = new Date(ts); return isNaN(d) ? "" : d.toTimeString().slice(0, 5); };
const cleanPrompt = (p) => (p || "").replace(/^Here is the Slack thread[\s\S]*?directed at you:\n/, "").replace(/\s*\*?Sent using\*?\s*$/, "").trim();
const plain = (t) => (t || "").replace(/[`*_#>]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\s+/g, " ").trim();
const agentHref = (a) => `#/agent/${enc(a.session)}/${enc(a.pane_id)}`;
const STATE = {
  blocked: "Needs approval", asks: "Asked you", working: "Working", unknown: "Working", done: "Done", idle: "Idle",
  running: "Running", waiting: "Ready", starting: "Starting", failed: "Failed", cancelled: "Stopped", closed: "Closed", queued: "Queued",
};
const lampState = (a) => (a.asks ? "asks" : a.status === "unknown" ? "working" : a.status);

// Markdown, safely: escape first, then a handful of block and inline forms.
function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])[_*]([^_*\n]+)[_*](?=[\s).,:;!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\((#\/(?:agent|run)\/[\w%.:-]+(?:\/[\w%.:-]+)?)\)/g, '<a href="$2">$1</a>')
    .replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>');
  const out = []; let list = null, para = [], code = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const line of (text || "").split("\n")) {
    if (/^\s*```/.test(line)) {
      if (code) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; } else { flushPara(); flushList(); code = []; }
      continue;
    }
    if (code) { code.push(line); continue; }

const STEP_KINDS = new Set(["tool_call", "tool_result", "thinking", "plan", "usage", "debug"]);

    }

    else if (ev.kind === "text" || ev.kind === "result") {

const DIGEST_VARS = ["--ink", "--panel", "--raise", "--line", "--text", "--muted", "--faint", "--amber", "--azure", "--mint", "--coral", "--body", "--mono"];

    + `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">`
    + `<base target="_blank"><style>:root{${vars}}*{box-sizing:border-box}`

function mountDigest(ui, key) {

  ui.dswitch.replaceChildren(segControl([["digest", "Digest"], ["trace", "Trace"]], () => traceView, setView));
  setView(traceView);
  const frame = h("iframe", { sandbox: "allow-popups allow-popups-to-escape-sandbox", title: "Digest", referrerpolicy: "no-referrer" });
  const metaLine = h("div", { class: "dmeta" });
  const note = h("div", { class: "dempty" });
  const link = (label, fn) => h("button", { type: "button", onclick: fn }, label);
  let shown = null, wait = null;
  const rebuild = async () => {
    try { await api("/api/digest/refresh", { method: "POST", body: JSON.stringify({ key }) }); } catch (err) { toast(err.message); }
    poll();

  async function poll() {
    clearTimeout(wait);
    if (!ui.side.isConnected) return; // left the page
    let d = null;
    try { d = await api(`/api/digest?key=${encodeURIComponent(key)}`); } catch { /* keep what is shown */ }
    if (!ui.side.isConnected) return;
    if (d && d.skipped) { ui.screen.classList.remove("has-digest", "show-digest"); return; } // neo's housekeeping
    if (d && d.status === "ready") {
      if (shown !== d.made_at) { shown = d.made_at; frame.srcdoc = digestDoc(d.html); }
      metaLine.replaceChildren(h("span", {}, `${DIGEST_KIND[d.kind] || "Digest"} · updated ${ago(d.made_at) === "now" ? "just now" : ago(d.made_at) + " ago"}${d.writing ? " · updating…" : ""}`),
        d.writing ? h("span") : link("Refresh", rebuild));
      if (frame.parentNode !== ui.side) ui.side.replaceChildren(metaLine, frame);

    // Done with it: close the session so it stops sitting on the board (ends the agent, frees its pane).
    chips.push(["Done · close session", "stop", async () => {
      if (!confirm("Close this session? The agent stops and its herdr pane is closed.")) return;
      await actOn(target, "close"); toast("Session closed"); location.hash = "#/";
    }]);
    const cs = chips.map((c) => c[0]).join("|");
    if (cs !== chipSig) { chipSig = cs; comp.setChips(chips); } // rebuilding chips mid-tap would swallow the tap

    const follow = first || nearBottom(ui.chat);
    const lastEv = d.events[d.events.length - 1];
    const sig = view + ":" + (view === "screen" ? d.screen : `${d.events.length}:${d.status}:${lastEv ? lastEv.ts + (lastEv.body || "").length : ""}`);
    if (sig !== lastSig) {
      lastSig = sig;
      const keepTop = ui.chat.scrollTop;
      if (view === "screen") ui.body.replaceChildren(h("div", { class: "screen-view" }, h("pre", {}, d.screen || "(empty screen)")));
      else ui.body.replaceChildren(renderTimeline(d.events, openSet));
      ui.chat.scrollTop = follow ? ui.chat.scrollHeight : keepTop;
    }
    first = false;
  }

  async function fetchAndPaint() {
    let d;
    // Ask only for events after the ones we have; the server checks the last one still lines up
    // (same sig as event_sig in server.py) and otherwise sends them all.
    const prev = details.get(cacheKey), have = prev ? prev.events : [];
    const last = have[have.length - 1];
    const q = last ? `?n=${have.length}&sig=${enc(`${last.kind}|${last.title || ""}|${[...(last.body || "")].length}`)}` : "";
    try {
      d = await api(`/api/agents/${enc(session)}/${enc(pane)}${q}`);
      if (d.events_from) d = { ...d, events: have.slice(0, d.events_from).concat(d.events) };
    }
    catch (err) {
      if (!details.has(cacheKey)) { ui.titleBox.replaceChildren(h("b", {}, "Agent not available"), h("small", {}, err.message)); ui.composer.hidden = true; }
      return;
    }
    details.set(cacheKey, d);
    if (ui.chat.isConnected) paintDetail(d); // skip if you've already moved to another screen
  }
  // Paint the last known conversation at once, then refresh in place.
  const loop = async () => { await fetchAndPaint(); if (ui.screen.isConnected) schedule(loop, 2500); };
  ui.resume = () => { if (ui.digestPoll) ui.digestPoll(); loop(); };
  if (details.has(cacheKey)) paintDetail(details.get(cacheKey));
  await fetchAndPaint();
  if (ui.screen.isConnected) schedule(loop, 2500);
}
const details = new Map(); // last detail per agent, for instant repaint when you come back

function runScreen(id) {
  const events = []; const openSet = new Set(); let meta = null, pending = false, first = true;
  const knownRun = overview && overview.runs.find((r) => r.id === id);
  const ui = detailShell({ title: knownRun ? knownRun.title || cleanPrompt(knownRun.prompt).slice(0, 120) : "", sub: h("small", {}) });
  mountDigest(ui, `run:${id}`);
  const comp = composerUI(ui.composer, {
    placeholder: "Follow up in this session",
    onSend: async (text) => { await api(`/api/runs/${id}/message`, { method: "POST", body: JSON.stringify({ prompt: text }) }); },
  });
  const draw = () => {
    pending = false;
    const follow = first || nearBottom(ui.chat);
    ui.body.replaceChildren(renderTimeline(events, openSet));
    if (follow) ui.chat.scrollTop = ui.chat.scrollHeight;
    first = false;
  };
  api(`/api/runs/${id}`).then((m) => { const pill = summaryPill(m.card); if (pill && ui.top.isConnected) topLinks(ui.top).prepend(pill); }).catch(() => {});
  const onTimeline = (e) => { events.push(JSON.parse(e.data)); if (!pending) { pending = true; requestAnimationFrame(draw); } };
  const onMeta = (e) => {
    meta = JSON.parse(e.data);
    if (meta.runtime === "herdr" && meta.herdr_pane && meta.status !== "closed") { trail.pop(); location.replace(`#/agent/${enc(meta.herdr_session)}/${enc(meta.herdr_pane)}`); return; }
    const cost = meta.cost_usd ? `, $${Number(meta.cost_usd).toFixed(2)}` : "";
    ui.titleBox.replaceChildren(h("b", {}, meta.title || cleanPrompt(meta.prompt).slice(0, 120) || "Task"), h("small", {}, h("span", { class: `lamp sm ${meta.status}` }), `${STATE[meta.status] || meta.status}, ${meta.engine}${cost}`));
    if (meta.slack_url && !ui.top.querySelector(".slack-link") && /^https:\/\/[\w-]+\.slack\.com\//.test(meta.slack_url)) topLinks(ui.top).append(h("a", { class: "slack-link", href: meta.slack_url, target: "_blank", rel: "noopener" }, "Slack thread"));
    ui.composer.hidden = meta.runtime === "herdr";
    comp.setChips(meta.status === "running" ? [["Stop", "stop", async () => { await api(`/api/runs/${id}/cancel`, { method: "POST", body: "{}" }); toast("Stopping"); }]] : []);
    if (!events.length) draw();
  };
  const listen = () => {
    stream = new EventSource(`/api/runs/${id}/stream?from=${events.length}`);
    stream.addEventListener("timeline", onTimeline);
    stream.addEventListener("meta", onMeta);
  };
  ui.resume = () => { if (ui.digestPoll) ui.digestPoll(); listen(); };
  listen();
}

async function sessionScreen(path) {
  const openSet = new Set();
  const ui = detailShell({ title: "", sub: h("small", {}) });
  const comp = composerUI(ui.composer, {
    placeholder: "Continue this conversation",
    onSend: async (text) => {
      const r = await api("/api/session/resume", { method: "POST", body: JSON.stringify({ path, prompt: text }) });
      toast("Reopened as a live agent");
      location.hash = `#/agent/${enc(r.session)}/${enc(r.pane_id)}`;
    },
  });
  comp.setChips([]);
  try {
    const d = await api(`/api/session?path=${enc(path)}`);
    ui.titleBox.replaceChildren(h("b", {}, d.title), h("small", {}, `${d.repo || "(no folder)"}, ${d.engine}, ${ago(d.mtime)} ago`));
    ui.body.replaceChildren(renderTimeline(d.events, openSet));
    ui.chat.scrollTop = ui.chat.scrollHeight;
    ui.resume = () => {}; // a finished conversation: nothing to refresh, so Back can reuse it as is
  } catch (err) {
    ui.titleBox.replaceChildren(h("b", {}, "Can't open this conversation"), h("small", {}, err.message));
  }
}

// ------------------------------------------------------------------ new task sheet
function openSheet(pre = {}) {
  if (document.querySelector(".sheet")) return;
  const o = overview || { agents: [], runs: [] };
  const recent = [...new Set([...o.agents.map((a) => a.cwd), ...o.runs.map((r) => r.cwd)].filter(Boolean))].slice(0, 5);
  let engine = o.default_engine || "claude", how = "live", where = pre.where || "folder";
  const close = () => { scrim.remove(); sheet.remove(); };
  const scrim = h("div", { class: "scrim", onclick: close });
  const segOf = (opts, get, set) => {
    const box = h("div", { class: "seg", role: "radiogroup" });
    const paintSeg = () => box.querySelectorAll("button").forEach((b) => { b.classList.toggle("on", b.dataset.v === get()); b.setAttribute("aria-checked", b.dataset.v === get()); });
    opts.forEach(([v, label]) => box.append(h("button", { type: "button", role: "radio", "data-v": v, onclick: () => { set(v); paintSeg(); syncHint(); } }, label)));
    paintSeg(); return box;
  };
  const hint = h("span", { class: "hint" });
  const whereHint = h("span", { class: "hint" });
  const syncHint = () => {
    hint.textContent = how === "live" ? "Runs in a terminal you can take over, and asks before risky steps." : "Runs to completion without stopping for approvals.";
    whereHint.textContent = where === "branch" ? "Starts a fresh branch off main in its own worktree, so parallel tasks never collide." : "Works directly in the folder below.";
  };
  const cwd = h("input", { class: "field", name: "cwd", value: pre.cwd || recent[0] || "", autocomplete: "off", autocapitalize: "off", spellcheck: "false", required: true });
  const task = h("textarea", { class: "field", name: "task", placeholder: "What should the agent do?", required: true }, pre.prompt || "");
  const start = h("button", { class: "btn primary", type: "submit", style: "height:50px;justify-content:center" }, "Start task");
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); start.disabled = true; start.textContent = how === "live" ? "Starting agent…" : "Starting…";
    const payload = { engine, cwd: cwd.value.trim(), prompt: task.value.trim(), mode: "full", branch: where === "branch", finding: pre.finding };
    try {
      if (how === "live") { const r = await api("/api/live", { method: "POST", body: JSON.stringify(payload) }); close(); location.hash = `#/agent/${enc(r.session)}/${enc(r.pane_id)}`; }
      else { const r = await api("/api/runs", { method: "POST", body: JSON.stringify(payload) }); close(); location.hash = `#/run/${r.id}`; }
    } catch (err) { toast(err.message); start.disabled = false; start.textContent = "Start task"; }
  } },
    h("label", { class: "lbl" }, "Agent", segOf([["claude", "Claude"], ["codex", "Codex"]], () => engine, (v) => (engine = v))),
    h("label", { class: "lbl" }, "How it runs", segOf([["live", "Live"], ["headless", "In the background"]], () => how, (v) => (how = v)), hint),
    h("label", { class: "lbl" }, "Where", segOf([["folder", "In the folder"], ["branch", "On a new branch"]], () => where, (v) => (where = v)), whereHint),
    h("label", { class: "lbl" }, "Folder", cwd, recent.length > 1 ? h("div", { class: "recent" }, recent.map((c) => h("button", { type: "button", onclick: () => (cwd.value = c) }, c.split("/").filter(Boolean).pop()))) : null),
    h("label", { class: "lbl" }, "Task", task),
    start,
  );
  syncHint();
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "New task" }, h("div", { class: "grab" }), h("h3", {}, pre.title || "New task"), form);
  document.body.append(scrim, sheet);
  if (!pre.prompt) setTimeout(() => task.focus(), 250);
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
}
document.getElementById("fab").addEventListener("click", () => openSheet());

// ------------------------------------------------------------------ routing
// Screens visited in this app session, newest last; Back returns to the previous one.
const trail = [];
const scrollMem = {}; // tab route -> scrollY, so Back from an agent lands where you were
let restoreY = null;
function applyRestore(done) {
  if (restoreY === null) return;
  window.scrollTo(0, restoreY);
  if (done || document.documentElement.scrollHeight - window.innerHeight >= restoreY) restoreY = null;
}
function remember(r) {
  if (r === "#/new" || r.startsWith("#/finding/")) return; // sheet openers are not places to go back to
  if (trail.length >= 2 && trail[trail.length - 2] === r) trail.pop(); // we went back
  else if (trail[trail.length - 1] !== r) trail.push(r);
  if (trail.length > 30) trail.shift();
}
let navForward = true;
function goBack() {
  navForward = false;
  const target = trail.length >= 2 ? trail[trail.length - 2] : "#/";
  if (target === (location.hash || "#/")) { location.hash = "#/"; return; }
  location.hash = target;
}

function currentTab() { const r = location.hash; return r.startsWith("#/today") || r.startsWith("#/watches") ? "today" : r.startsWith("#/runs") ? "runs" : r.startsWith("#/work") ? "work" : "home"; }
function route() {
  stopWork();
  document.querySelectorAll(".sheet, .scrim").forEach((n) => n.remove()); // navigating away closes the sheet
  let r = location.hash || "#/";
  if (/^#\d{8}-\d{6}-[0-9a-f]{6}$/.test(r)) { location.replace(`#/run/${r.slice(1)}`); return; } // links from Slack
  if (lastRoute && !/^#\/(agent|run|session)\//.test(lastRoute)) scrollMem[lastRoute] = window.scrollY;
  leaveScreen();
  lastRoute = r;
  const goingBack = trail.length >= 2 && trail[trail.length - 2] === r;
  if (goingBack) navForward = false;
  remember(r);
  const parts = r.slice(2).split("/").filter(Boolean);
  const detail = parts[0] === "agent" || parts[0] === "run" || parts[0] === "session";
  document.getElementById("tabbar").hidden = detail;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", !detail && t.dataset.tab === currentTab()));
  restoreY = detail ? null : scrollMem[r] ?? null;
  if (restoreY === null) window.scrollTo(0, 0);
  const forward = navForward; navForward = true; // next navigation counts as forward unless Back sets otherwise
  if (!detail) paintedSig = ""; // entering a tab: its first paint must happen even if data is unchanged
  if (detail && reopenScreen(r, forward)) return;
  if (parts[0] === "agent" && parts.length === 3) { navForward = forward; const p = agentScreen(decodeURIComponent(parts[1]), decodeURIComponent(parts[2])); navForward = true; return p; }
  if (parts[0] === "run" && parts[1]) { navForward = forward; runScreen(parts[1]); navForward = true; return; }
  if (parts[0] === "session" && parts[1]) { navForward = forward; sessionScreen(decodeURIComponent(parts.slice(1).join("/"))); navForward = true; return; }
  if (parts[0] === "new") { location.replace("#/"); setTimeout(() => openSheet(), 50); return; }
  if (parts[0] === "finding" && parts[1]) { pendingFinding = decodeURIComponent(parts[1]); location.replace("#/today"); return; }
  if (parts[0] === "agents") { location.replace("#/"); return; } // the agents list is the home screen now
  tabLoop(currentTab(), true);
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const ui = screenCache.get(lastRoute);
  if (ui && ui.screen.isConnected && ui.resume) { stopWork(); ui.resume(); } // same screen: just pick up updates
  else if ((location.hash || "#/") === lastRoute && !ui) { stopWork(); tabLoop(currentTab(), false); }
  else route();
});
route();
</script>
