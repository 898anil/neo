[tool.poetry]
name = "slack-codex-bot"
version = "0.1.0"
description = "Mention @neo in Slack to run Claude Code or Codex locally, with every step visible"
authors = ["neo contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
slack-bolt = "^1.20"
aiohttp = "^3.10"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
