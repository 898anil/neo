name: macOS app

on:
  pull_request:
    paths: ["macos/**", "cos/**", "app.py", "commands.py", "sessions.py", "chief.py", "prompts/**", ".github/workflows/macos-app.yml"]
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Swift tests
        run: swift test --package-path macos
      - name: Build Apple silicon
        run: ARCH=arm64 macos/scripts/build-app.sh
      - name: Build Intel
        run: ARCH=x86_64 macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neo-mac
          path: macos/dist/*.dmg
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/dist/*.dmg \
            --title "neo for Mac ${GITHUB_REF_NAME#app-v}" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/macos/install.sh | bash\`, or download the DMG for your Mac (arm64 = Apple silicon, x86_64 = Intel). See [macos/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/macos/README.md)."
